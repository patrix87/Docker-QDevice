services:
  corosync-qnetd:
    image: corosync-qnetd
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qnetd
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD}
    ports:
      - "5403:5403"
      - "22:22"
    volumes:
      - ./qnetd/conf/:/etc/corosync/
      - ./qnetd/logs/corosync/:/var/log/corosync/
      - ./qnetd/logs/qdevice/:/var/log/qdevice/
      - ./ssh/:/root/ssh_host_keys
    restart: unless-stopped